name: Recovery v0.15 package

on:
  pull_request:
    branches:
      - recovery-v0.11-ci-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build validated Chrome MV3 ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frozen install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build

      - name: Package extension
        shell: bash
        run: |
          cd build/chrome-mv3-prod
          zip -qr /tmp/threadline-recovery-v0.15-chrome-mv3.zip .
          sha256sum /tmp/threadline-recovery-v0.15-chrome-mv3.zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: threadline-recovery-v0.15-chrome-mv3
          path: /tmp/threadline-recovery-v0.15-chrome-mv3.zip
          if-no-files-found: error
          retention-days: 30
