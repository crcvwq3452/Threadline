name: Recovery v0.14 validation

on:
  pull_request:
    branches:
      - recovery-v0.11-ci-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Apply v0.14 · Type Check · Test · Integration · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout recovery driver head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: driver
          fetch-depth: 1

      - name: Checkout exact Threadline PR #6 baseline
        uses: actions/checkout@v4
        with:
          ref: 38385a345cb5675ad528330714adecdaadae98cc
          path: target
          fetch-depth: 0

      - name: Reconstruct and verify recovery patch
        shell: bash
        run: |
          tr -d '\r\n' < driver/.recovery-ci/threadline_v0_14_payload.b64 | base64 -d > /tmp/threadline_recovery_patch_v0_14.zip
          echo "7bcdd063ed119ef7ea0937df6b4589f9bb062188ce50845fe6a3adb874b64e19  /tmp/threadline_recovery_patch_v0_14.zip" | sha256sum -c -
          rm -rf /tmp/threadline-v0_14
          mkdir -p /tmp/threadline-v0_14
          unzip -q /tmp/threadline_recovery_patch_v0_14.zip -d /tmp/threadline-v0_14
          test -x /tmp/threadline-v0_14/threadline_recovery_patch_v0_14/tools/apply-all.sh

      - name: Apply v0.14 to pristine baseline
        shell: bash
        run: |
          /tmp/threadline-v0_14/threadline_recovery_patch_v0_14/tools/apply-all.sh "$GITHUB_WORKSPACE/target"
          git -C target status --short

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies with frozen lockfile
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: target
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        working-directory: target
        run: pnpm test

      - name: Set up Node 24 for recovery regression harness
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Recovery patch contracts and integration checks
        shell: bash
        run: |
          npx() {
            if [ "${1:-}" = "tsc" ]; then
              shift
              "$GITHUB_WORKSPACE/target/node_modules/.bin/tsc" "$@"
            else
              command npx "$@"
            fi
          }
          export -f npx
          bash /tmp/threadline-v0_14/threadline_recovery_patch_v0_14/tests/run-all.sh

      - name: Restore Node 20 for Threadline production build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Production build
        working-directory: target
        run: pnpm build

      - name: Install Playwright Chromium
        working-directory: target
        run: pnpm exec playwright install --with-deps chromium

      - name: Create branch-preservation ZIP fixture
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          fixture = [{
              "id": "e2e-conv-1",
              "conversation_id": "e2e-conv-1",
              "title": "Recovery Browser E2E",
              "create_time": 1700000000,
              "update_time": 1700000030,
              "current_node": "a-main",
              "mapping": {
                  "root": {
                      "id": "root",
                      "message": None,
                      "parent": None,
                      "children": ["u1"],
                  },
                  "u1": {
                      "id": "u1",
                      "parent": "root",
                      "children": ["a-main", "a-side"],
                      "message": {
                          "id": "u1",
                          "author": {"role": "user", "name": None, "metadata": {}},
                          "create_time": 1700000001,
                          "update_time": None,
                          "content": {"content_type": "text", "parts": ["E2E_BRANCH_QUESTION"]},
                          "status": "finished_successfully",
                          "end_turn": None,
                          "weight": 1.0,
                          "metadata": {},
                          "recipient": "all",
                      },
                  },
                  "a-main": {
                      "id": "a-main",
                      "parent": "u1",
                      "children": [],
                      "message": {
                          "id": "a-main",
                          "author": {"role": "assistant", "name": None, "metadata": {}},
                          "create_time": 1700000002,
                          "update_time": None,
                          "content": {"content_type": "text", "parts": ["MAIN_BRANCH_SENTINEL"]},
                          "status": "finished_successfully",
                          "end_turn": True,
                          "weight": 1.0,
                          "metadata": {},
                          "recipient": "all",
                      },
                  },
                  "a-side": {
                      "id": "a-side",
                      "parent": "u1",
                      "children": [],
                      "message": {
                          "id": "a-side",
                          "author": {"role": "assistant", "name": None, "metadata": {}},
                          "create_time": 1700000003,
                          "update_time": None,
                          "content": {"content_type": "text", "parts": ["SIDE_BRANCH_SENTINEL"]},
                          "status": "finished_successfully",
                          "end_turn": True,
                          "weight": 1.0,
                          "metadata": {},
                          "recipient": "all",
                      },
                  },
              },
          }]
          with zipfile.ZipFile("/tmp/chatgpt-recovery-e2e.zip", "w", zipfile.ZIP_DEFLATED) as z:
              z.writestr("conversations.json", json.dumps(fixture))
          PY
          unzip -l /tmp/chatgpt-recovery-e2e.zip

      - name: Chromium MV3 ZIP import and branch-preservation E2E
        shell: bash
        run: |
          cat > /tmp/recovery-browser-e2e.cjs <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const os = require('os')
          const { createRequire } = require('module')

          const workspace = process.env.GITHUB_WORKSPACE
          const targetRoot = path.join(workspace, 'target')
          const requireTarget = createRequire(path.join(targetRoot, 'package.json'))
          const { chromium } = requireTarget('@playwright/test')

          function findExtensionDir() {
            const candidates = [
              path.join(targetRoot, 'build', 'chrome-mv3-prod'),
              path.join(targetRoot, 'build', 'chrome-mv3'),
            ]
            for (const candidate of candidates) {
              if (fs.existsSync(path.join(candidate, 'manifest.json'))) return candidate
            }
            const buildRoot = path.join(targetRoot, 'build')
            if (fs.existsSync(buildRoot)) {
              for (const name of fs.readdirSync(buildRoot)) {
                const candidate = path.join(buildRoot, name)
                if (fs.existsSync(path.join(candidate, 'manifest.json'))) return candidate
              }
            }
            throw new Error('Could not locate built extension manifest under target/build')
          }

          async function readMemories(page) {
            return page.evaluate(async () => {
              return await new Promise((resolve, reject) => {
                const open = indexedDB.open('AIMemoryDB')
                open.onerror = () => reject(open.error)
                open.onsuccess = () => {
                  const db = open.result
                  const tx = db.transaction('memories', 'readonly')
                  const req = tx.objectStore('memories').getAll()
                  req.onerror = () => reject(req.error)
                  req.onsuccess = () => resolve(req.result)
                }
              })
            })
          }

          async function runtimeMessage(page, message) {
            return page.evaluate((msg) => new Promise((resolve, reject) => {
              chrome.runtime.sendMessage(msg, (response) => {
                if (chrome.runtime.lastError) reject(new Error(chrome.runtime.lastError.message))
                else resolve(response)
              })
            }), message)
          }

          ;(async () => {
            const extensionPath = findExtensionDir()
            console.log('E2E extension path:', extensionPath)
            const userDataDir = fs.mkdtempSync(path.join(os.tmpdir(), 'threadline-e2e-'))
            const context = await chromium.launchPersistentContext(userDataDir, {
              headless: false,
              locale: 'en-US',
              args: [
                `--disable-extensions-except=${extensionPath}`,
                `--load-extension=${extensionPath}`,
                '--no-first-run',
                '--no-default-browser-check',
              ],
            })

            const errors = []
            context.on('page', (p) => {
              p.on('pageerror', (e) => errors.push(`pageerror: ${e.message}`))
              p.on('console', (m) => {
                if (m.type() === 'error') errors.push(`console: ${m.text()}`)
              })
            })

            let workers = context.serviceWorkers()
            let worker = workers[0]
            if (!worker) worker = await context.waitForEvent('serviceworker', { timeout: 15000 })
            const workerUrl = new URL(worker.url())
            const extensionId = workerUrl.host
            if (!extensionId) throw new Error(`Could not infer extension ID from worker URL ${worker.url()}`)
            console.log('E2E extension ID:', extensionId)

            const manifest = JSON.parse(fs.readFileSync(path.join(extensionPath, 'manifest.json'), 'utf8'))
            console.log('E2E built manifest action:', JSON.stringify(manifest.action || {}))

            const page = await context.newPage()
            page.on('pageerror', (e) => errors.push(`host pageerror: ${e.message}`))
            page.on('console', (m) => {
              if (m.type() === 'error') errors.push(`host console: ${m.text()}`)
            })
            await page.goto('https://chatgpt.com/', { waitUntil: 'domcontentloaded', timeout: 30000 })

            const panelOpened = await worker.evaluate(async () => {
              const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
              for (let attempt = 0; attempt < 30; attempt++) {
                const tabs = await chrome.tabs.query({})
                const tab = tabs.find((t) => (t.url || '').startsWith('https://chatgpt.com/'))
                if (tab?.id) {
                  try {
                    await chrome.tabs.sendMessage(tab.id, { type: 'OPEN_MEMORY_PANEL' })
                    return { ok: true, tabId: tab.id }
                  } catch {}
                }
                await sleep(200)
              }
              return { ok: false }
            })
            console.log('E2E floating panel open:', JSON.stringify(panelOpened))
            if (!panelOpened?.ok) throw new Error('Could not open Threadline floating panel on host page')

            const importToggle = page.getByRole('button', { name: /Import backup/i })
            await importToggle.waitFor({ state: 'visible', timeout: 15000 })
            await importToggle.click()

            const chatgptButton = page.getByRole('button', { name: /ChatGPT/i }).first()
            await chatgptButton.waitFor({ state: 'visible', timeout: 10000 })
            await chatgptButton.click({ noWaitAfter: true })

            const fileInputs = page.locator('input[type="file"]')
            const fileInputCount = await fileInputs.count()
            const inputMeta = []
            for (let i = 0; i < fileInputCount; i++) {
              inputMeta.push({
                index: i,
                accept: await fileInputs.nth(i).getAttribute('accept'),
              })
            }
            console.log('E2E file inputs:', JSON.stringify(inputMeta))
            const providerInput = page.locator('input[type="file"][accept*=".zip"]').first()
            await providerInput.waitFor({ state: 'attached', timeout: 10000 })
            await providerInput.setInputFiles('/tmp/chatgpt-recovery-e2e.zip')

            const successStatus = page.getByText(
              /Successfully imported \d+ .* from ChatGPT|ChatGPT: imported \d+ new/i,
            ).first()
            const failureStatus = page.getByText(
              /Import from ChatGPT failed|ChatGPT import failed|failed to import.*ChatGPT/i,
            ).first()
            const outcome = await Promise.race([
              successStatus.waitFor({ state: 'visible', timeout: 30000 }).then(() => 'success'),
              failureStatus.waitFor({ state: 'visible', timeout: 30000 }).then(() => 'failure'),
            ])
            const bodyText = await page.locator('body').innerText()
            console.log('E2E floating-panel status:', bodyText.replace(/\s+/g, ' ').slice(-1200))
            if (outcome !== 'success') {
              throw new Error(`Floating panel reported import failure: ${bodyText}`)
            }

            const extensionPage = await context.newPage()
            await extensionPage.goto(`chrome-extension://${extensionId}/tabs/memory-graph.html`)
            await extensionPage.waitForLoadState('domcontentloaded')

            const all = await readMemories(extensionPage)

            const records = all.filter((r) => r.sessionId === 'openai:e2e-conv-1')
            console.log('E2E stored records:', JSON.stringify(records.map((r) => ({
              id: r.id,
              originalMessageId: r.originalMessageId,
              role: r.role,
              content: r.content,
              roundIndex: r.roundIndex,
              branchIndex: r.branchIndex,
              branchId: r.branchId,
              pathId: r.pathId,
              metadata: r.metadata,
            })), null, 2))

            if (!records.some((r) => r.content.includes('MAIN_BRANCH_SENTINEL'))) {
              throw new Error('Main branch assistant answer missing from IndexedDB')
            }
            if (!records.some((r) => r.content.includes('SIDE_BRANCH_SENTINEL'))) {
              throw new Error('Inactive side branch assistant answer missing from IndexedDB')
            }
            const assistants = records.filter((r) => r.role === 'assistant')
            if (assistants.length < 2) throw new Error(`Expected >=2 assistant records, got ${assistants.length}`)
            const assistantPaths = new Set(assistants.map((r) => r.pathId).filter(Boolean))
            if (assistantPaths.size < 2) {
              throw new Error(`Expected distinct assistant paths, got ${JSON.stringify([...assistantPaths])}`)
            }
            const originals = new Set(records.map((r) => r.originalMessageId).filter(Boolean))
            for (const id of ['u1', 'a-main', 'a-side']) {
              if (!originals.has(id)) throw new Error(`Missing originalMessageId ${id}`)
            }

            const search = await runtimeMessage(extensionPage, {
              type: 'SEARCH_MEMORIES',
              payload: { query: 'SIDE_BRANCH_SENTINEL', topK: 5 },
            })
            console.log('E2E search response:', JSON.stringify(search))
            const results = search?.payload?.results || []
            if (!results.some((r) => String(r.content || '').includes('SIDE_BRANCH_SENTINEL'))) {
              throw new Error('Lexical search did not recover inactive side branch sentinel')
            }

            if (errors.length) {
              const meaningful = errors.filter((e) => !/favicon|DevTools/i.test(e))
              if (meaningful.length) {
                console.log('E2E browser errors observed:', meaningful)
              }
            }

            await context.close()
            console.log('BROWSER_E2E_PASS')
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
          xvfb-run -a node /tmp/recovery-browser-e2e.cjs
