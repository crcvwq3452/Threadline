name: Recovery v0.14 semantic and Recall acceptance

on:
  pull_request:
    branches:
      - recovery-v0.11-ci-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-recall:
    name: Embeddings · Semantic search · Recall injection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Create semantic fixture
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path('/tmp/semantic-recall')
          out.mkdir(exist_ok=True)
          def msg(mid, role, text, ts, end_turn=True):
              return {
                  'id':mid,
                  'author':{'role':role,'name':None,'metadata':{}},
                  'create_time':ts,
                  'update_time':None,
                  'content':{'content_type':'text','parts':[text]},
                  'status':'finished_successfully',
                  'end_turn':end_turn if role=='assistant' else None,
                  'weight':1.0,
                  'metadata':{},
                  'recipient':'all',
              }
          conv={
              'id':'semantic-recall-e2e',
              'conversation_id':'semantic-recall-e2e',
              'title':'Semantic Recall E2E',
              'create_time':1700500000,
              'update_time':1700500010,
              'current_node':'sr-a',
              'mapping':{
                  'sr-root':{'id':'sr-root','message':None,'parent':None,'children':['sr-u']},
                  'sr-u':{
                      'id':'sr-u',
                      'message':msg('sr-u','user','SEMANTIC_MEMORY_QUESTION',1700500001),
                      'parent':'sr-root','children':['sr-a']
                  },
                  'sr-a':{
                      'id':'sr-a',
                      'message':msg(
                          'sr-a','assistant',
                          'SEMANTIC_MEMORY_SENTINEL. A domestic feline is resting peacefully on a comfortable sofa near the window.',
                          1700500002
                      ),
                      'parent':'sr-u','children':[]
                  }
              }
          }
          (out/'semantic.json').write_text(json.dumps([conv]),encoding='utf-8')
          PY

      - name: Chromium semantic + Recall E2E
        shell: bash
        run: |
          cat > /tmp/semantic-recall-e2e.cjs <<'NODE'
          const fs=require('fs')
          const path=require('path')
          const os=require('os')
          const {createRequire}=require('module')
          const root=process.cwd()
          const requireTarget=createRequire(path.join(root,'package.json'))
          const {chromium}=requireTarget('@playwright/test')
          const build=path.join(root,'build','chrome-mv3-prod')
          const fixture='/tmp/semantic-recall/semantic.json'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))

          async function workerFor(context){
            return context.serviceWorkers()[0] || await context.waitForEvent('serviceworker',{timeout:15000})
          }
          async function allMemories(page){
            return page.evaluate(()=>new Promise((resolve,reject)=>{
              const q=indexedDB.open('AIMemoryDB')
              q.onerror=()=>reject(q.error)
              q.onsuccess=()=>{
                const db=q.result
                const tx=db.transaction('memories','readonly')
                const r=tx.objectStore('memories').getAll()
                r.onerror=()=>reject(r.error)
                r.onsuccess=()=>resolve(r.result)
              }
            }))
          }
          async function runtimeMessage(page,msg){
            return page.evaluate(m=>new Promise((resolve,reject)=>{
              chrome.runtime.sendMessage(m,r=>{
                if(chrome.runtime.lastError) reject(new Error(chrome.runtime.lastError.message))
                else resolve(r)
              })
            }),msg)
          }
          async function openPanel(page,worker){
            const r=await worker.evaluate(async()=>{
              const tabs=await chrome.tabs.query({})
              const tab=tabs.find(t=>(t.url||'').startsWith('https://chatgpt.com/'))
              if(!tab?.id) return {ok:false}
              await chrome.tabs.sendMessage(tab.id,{type:'OPEN_MEMORY_PANEL'})
              return {ok:true}
            })
            if(!r.ok) throw new Error('ChatGPT tab not found')
            const panel=page.getByRole('dialog',{name:/Threadline panel/i})
            await panel.waitFor({state:'visible',timeout:15000})
            return panel
          }
          async function importDirect(panel){
            const toggle=panel.getByRole('button',{name:/Import backup/i})
            await toggle.click()
            const provider=panel.locator('button').filter({hasText:'ChatGPT (conversations.json)'}).first()
            await provider.waitFor({state:'visible',timeout:10000})
            await provider.click({noWaitAfter:true})
            const input=panel.locator('input[type="file"][accept*=".json"]').last()
            await input.setInputFiles(fixture)
            const start=Date.now()
            while(Date.now()-start<30000){
              const txt=(await panel.innerText()).replace(/\s+/g,' ')
              if(/Successfully imported \d+ .* from ChatGPT|ChatGPT: imported \d+ new/i.test(txt)) return
              if(/failed to import|import failed/i.test(txt)) throw new Error('Import failed: '+txt)
              await sleep(250)
            }
            throw new Error('Direct semantic fixture import timed out')
          }

          ;(async()=>{
            const userDataDir=fs.mkdtempSync(path.join(os.tmpdir(),'threadline-semantic-'))
            const context=await chromium.launchPersistentContext(userDataDir,{
              headless:false,
              args:[`--disable-extensions-except=${build}`,`--load-extension=${build}`,'--no-first-run','--no-default-browser-check']
            })
            const worker=await workerFor(context)
            const extensionId=new URL(worker.url()).host
            const host=await context.newPage()
            await host.goto('https://chatgpt.com/',{waitUntil:'domcontentloaded',timeout:30000})
            await host.locator('#ai-memory-float-root').waitFor({state:'attached',timeout:15000})
            const panel=await openPanel(host,worker)
            await importDirect(panel)

            const ext=await context.newPage()
            await ext.goto(`chrome-extension://${extensionId}/tabs/memory-graph.html`)
            await ext.waitForLoadState('domcontentloaded')

            // Explicitly prove the stored record obtains a real 384-d embedding.
            const embedStart=Date.now()
            let embedded=null
            while(Date.now()-embedStart<180000){
              const all=await allMemories(ext)
              embedded=all.find(r=>r.sessionId==='openai:semantic-recall-e2e' && r.role==='assistant' && r.hasEmbedding===1 && r.embedding)
              if(embedded) break
              await sleep(1000)
            }
            if(!embedded) {
              const all=await allMemories(ext)
              const diag=all.filter(r=>r.sessionId==='openai:semantic-recall-e2e').map(r=>({
                id:r.id,hasEmbedding:r.hasEmbedding,embeddingLength:r.embedding?.length,content:r.content
              }))
              throw new Error('Embedding never became ready: '+JSON.stringify(diag))
            }
            if(embedded.embedding.length!==384) throw new Error('Expected 384-d embedding, got '+embedded.embedding.length)
            console.log('EMBEDDING_READY_MS',Date.now()-embedStart,'DIM',embedded.embedding.length)

            // Semantic-only query: deliberately no shared lexical terms with the stored sentence.
            const semStart=Date.now()
            const semantic=await runtimeMessage(ext,{
              type:'SEARCH_MEMORIES',
              payload:{query:'kitten napping on a couch',topK:5}
            })
            console.log('SEMANTIC_SEARCH_MS',Date.now()-semStart)
            console.log('SEMANTIC_RESULTS',JSON.stringify(semantic))
            const semResults=semantic?.payload?.results||[]
            if(!semResults.some(r=>r.sessionId==='openai:semantic-recall-e2e')){
              throw new Error('Semantic-only query did not recover embedded memory')
            }

            // Actual ChatGPT Recall button -> results shadow DOM -> selection -> composer injection.
            const composer=host.locator('#prompt-textarea')
            await composer.waitFor({state:'visible',timeout:20000})
            await composer.fill('SEMANTIC_MEMORY_SENTINEL')
            const recall=host.locator('#ai-memory-recall-btn')
            await recall.waitFor({state:'visible',timeout:20000})
            await recall.click()

            const recallRoot=host.locator('#ai-memory-recall-results-root')
            await recallRoot.waitFor({state:'attached',timeout:90000})
            const panelState=await host.evaluate(()=>{
              const root=document.getElementById('ai-memory-recall-results-root')
              if(!root?.shadowRoot) return null
              return {
                items:root.shadowRoot.querySelectorAll('.item').length,
                text:root.shadowRoot.textContent
              }
            })
            console.log('RECALL_PANEL',JSON.stringify(panelState))
            if(!panelState || panelState.items<1 || !String(panelState.text||'').includes('SEMANTIC_MEMORY_SENTINEL')){
              throw new Error('Recall results panel missing expected evidence')
            }

            await host.evaluate(()=>{
              const root=document.getElementById('ai-memory-recall-results-root')
              const shadow=root?.shadowRoot
              const item=shadow?.querySelector('.item')
              if(!(item instanceof HTMLElement)) throw new Error('Recall item missing')
              item.click()
              const confirm=shadow?.querySelector('.confirm')
              if(!(confirm instanceof HTMLButtonElement)) throw new Error('Recall confirm missing')
              if(confirm.disabled) throw new Error('Recall confirm remained disabled')
              confirm.click()
            })

            await host.waitForFunction(()=>{
              const el=document.getElementById('prompt-textarea')
              if(!el) return false
              const text=el instanceof HTMLTextAreaElement ? el.value : (el.innerText||el.textContent||'')
              return text.includes('RETRIEVED HISTORICAL EVIDENCE') && text.includes('SEMANTIC_MEMORY_SENTINEL')
            },null,{timeout:20000})

            const injected=await composer.evaluate(el=>el instanceof HTMLTextAreaElement ? el.value : (el.innerText||el.textContent||''))
            console.log('RECALL_INJECTED_LENGTH',injected.length)
            if(!injected.includes('CURRENT AUTHORITY')) throw new Error('Injected prompt missing CURRENT AUTHORITY section')
            if(!injected.includes('RETRIEVED HISTORICAL EVIDENCE')) throw new Error('Injected prompt missing historical evidence label')
            if(!injected.includes('SEMANTIC_MEMORY_SENTINEL')) throw new Error('Injected prompt missing selected memory')

            await context.close()
            console.log('SEMANTIC_RECALL_E2E_PASS')
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
          xvfb-run -a node /tmp/semantic-recall-e2e.cjs
